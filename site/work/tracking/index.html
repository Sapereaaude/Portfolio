h conversation.\"}, {\"a\": \"agents\", \"b\": \"cassandre\", \"why\": \"From helping teams ask better questions to automatically checking what can already be verified.\"}, {\"a\": \"rbk\", \"b\": \"system\", \"why\": \"Different environments. The same principle: listen, adapt, improve.\"}, {\"a\": \"rbk\", \"b\": \"programme\", \"why\": \"One rough first cohort, then a habit: let each cohort teach the next.\"}, {\"a\": \"stress\", \"b\": \"rbk\", \"why\": \"Same bootcamp, two ways of listening: one-to-one conversations and a stress measure.\"}, {\"a\": \"stress\", \"b\": \"tracking\", \"why\": \"Measuring what people go through to adjust their conditions. Years later, I tried it on myself.\"}, {\"a\": \"vizcom\", \"b\": \"aiid\", \"why\": \"The survey said what designers wanted from AI. The diary showed what they did with it over three months.\"}, {\"a\": \"vizcom\", \"b\": \"sat3d\", \"why\": \"Two ways of staying with users over time: a three-month diary and a monthly pulse.\"}, {\"a\": \"swiss\", \"b\": \"agents\", \"why\": \"A method first, then assistants that carry methods to people who never asked for one.\"}, {\"a\": \"swiss\", \"b\": \"cassandre\", \"why\": \"AI runs the predictable part, a human decides what matters. Same split, one step further.\"}, {\"a\": \"aiid\", \"b\": \"agents\", \"why\": \"Studying how others adopt AI, while building assistants for my own teams.\"}, {\"a\": \"system\", \"b\": \"community\", \"why\": \"A shared repository for five teams, then a shared space for the researchers themselves.\"}, {\"a\": \"community\", \"b\": \"superpowers\", \"why\": \"The same bet twice: the expertise is already in the building, people just can’t find each other.\"}, {\"a\": \"algo_journey\", \"b\": \"algo_personas\", \"why\": \"Who is learning, and when they most need to understand: two halves of one question.\"}, {\"a\": \"algo_journey\", \"b\": \"clinic\", \"why\": \"Finding the moments that matter in a journey: for customers implementing a product, for members seeking care.\"}, {\"a\": \"mind\", \"b\": \"clinic\", \"why\": \"Two Alan products, one starting point: understand how people think about care before designing for it.\"}, {\"a\": \"mind\", \"b\": \"tracking\", \"why\": \"Mental health, studied for a product, then tracked for myself.\"}, {\"a\": \"prio\", \"b\": \"plm\", \"why\": \"Who decides which products get made, and how engineers keep them alive afterwards: two ends of the same pipeline.\"}, {\"a\": \"prio\", \"b\": \"system\", \"why\": \"Atomic research, built as a repository in one project and used as the analysis method in the other.\"}, {\"a\": \"usab\", \"b\": \"sat3d\", \"why\": \"Evaluative research made readable: a verdict in ten seconds, a pulse every month.\"}, {\"a\": \"usab\", \"b\": \"cassandre\", \"why\": \"Making a usability verdict readable was one step. Checking the predictable issues before any participant is the next question.\"}, {\"a\": \"teach\", \"b\": \"algo_academy\", \"why\": \"From classrooms to an academy: still working out where someone really is before deciding where to take them.\"}, {\"a\": \"programme\", \"b\": \"sat3d\", \"why\": \"A cohort retrospective and a monthly survey are the same reflex: ask again, regularly.\"}];\n/* Thematic journeys: a project can sit on several threads. Keep in step with the home page. */\nvar THREADS = [{\"n\": \"01\", \"short\": \"Understand people\", \"order\": [\"rbk\", \"programme\", \"stress\", \"algo_journey\", \"algo_personas\", \"algo_academy\", \"mind\", \"clinic\", \"clear\", \"system\", \"plm\", \"prio\", \"sat3d\", \"aiid\", \"vizcom\", \"cassandre\"]}, {\"n\": \"02\", \"short\": \"Make knowledge everyone’s business\", \"order\": [\"teach\", \"algo_academy\", \"system\", \"usab\", \"community\", \"superpowers\", \"agents\", \"cassandre\"]}, {\"n\": \"03\", \"short\": \"Automate the predictable\", \"order\": [\"swiss\", \"agents\", \"aiid\", \"vizcom\", \"cassandre\"]}];\nvar TITLES = {\"agents\": \"A small pantheon of agents\", \"aiid\": \"AI in Design\", \"algo_academy\": \"Algolia Academy\", \"algo_journey\": \"The customer learning journey\", \"algo_personas\": \"Learner personas\", \"cassandre\": \"Cassandre\", \"clinic\": \"Alan Clinic\", \"community\": \"One community, four cities\", \"mind\": \"Alan Mind\", \"plm\": \"Idea to recycling\", \"prio\": \"How products get chosen\", \"programme\": \"Better from cohort to cohort\", \"rbk\": \"Refugees to software engineers\", \"sat3d\": \"A monthly pulse on 3D tools\", \"stress\": \"Stress & success\", \"superpowers\": \"Superpowers Directory\", \"swiss\": \"The ten-question Swiss knife\", \"system\": \"A research system for 5 teams\", \"teach\": \"Teacher, then Amman\", \"tracking\": \"Tracking Bad\", \"usab\": \"Usability, readable in one glance\", \"vizcom\": \"After the demo effect\"};\nvar links = [];\nLINKS.forEach(function (l) {\nvar other = l.a === pid ? l.b : (l.b === pid ? l.a : null);\nif (other) { links.push({ href: 'Case-' + other + '.dc.html', title: TITLES[other] || other, why: l.why }); }\n});\nlinks = links.slice(0, 3);\nvar threads = THREADS.filter(function (t) { return t.order.indexOf(pid) !== -1; }).map(function (t) { return t.n + ' ' + t.short; });\nreturn {\naccent: this.props.accent ?? '#3B5BB8', n: this.props.n ?? '',\nlinks: links, threads: threads,\nshowConnects: part === 'connects' && links.length > 0,\nshowThreads: part === 'threads' && threads.length > 0\n};\n}\n}"}}}</script>
