text-decoration: none; font-size: 15px; font-weight: 600; padding: 10px 16px; border: 1px solid #D5D7E0; border-radius: 999px"},["← Back to Safaa × Dust"]],["a",{"href":"Main.dc.html","style":"white-space: nowrap; text-decoration: none; font-size: 15px; font-weight: 600; padding: 10px 16px; border: 1px solid #D5D7E0; border-radius: 999px"},["Full portfolio"]]]]]],["main",{"style":"max-width: 680px; margin: 0 auto; padding: clamp(16px, 4vw, 48px) 0 clamp(40px, 6vw, 72px); display: flex; flex-direction: column; gap: 18px"},[["header",{"style":"display: flex; flex-direction: column; align-items: flex-start; gap: 14px; margin-bottom: 10px"},[["p",{"style":"margin: 0; font-size: 12px; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; color: #4A4A57"},["Safaa × Dust · Cover letter"]],["h1",{"style":"margin: 0; font-family: 'Anton', Impact, sans-serif; font-weight: 400; text-transform: uppercase; font-size: clamp(36px, 5.4vw, 64px); line-height: 1.02; text-wrap: balance"},["A letter to the Dust team",["span",{"style":"color: #D13A28"},["."]]]],["a",{"href":"/Safaa_El_Ouafi_Cover_Letter_Dust.pdf","download":"Safaa_El_Ouafi_Cover_Letter_Dust.pdf","style":"display: inline-flex; align-items: center; min-height: 52px; padding: 0 24px; border-radius: 999px; font-size: 16px; font-weight: 700; text-decoration: none; white-space: nowrap; background: #17171F; color: #FFFFFF"},["Download PDF ↓"]]]],["p",{"style":"margin: 0; font-family: 'Newsreader', Georgia, serif; font-size: clamp(18px, 1.6vw, 20px); line-height: 1.65; text-wrap: pretty"},["Dear Dust team,"]],["p",{"style":"margin: 0; font-family: 'Newsreader', Georgia, serif; font-size: clamp(18px, 1.6vw, 20px); line-height: 1.65; text-wrap: pretty"},["I’ve had several careers, but looking back, I realise I’ve been doing essentially the same thing all along: understanding what people need, building something useful, observing what happens, and finding ways to make it better."]],["p",{"style":"margin: 0; font-family: 'Newsreader', Georgia, serif; font-size: clamp(18px, 1.6vw, 20px); line-height: 1.65; text-wrap: pretty"},["I started in education, designing learning experiences and rebuilding programmes around the needs of learners. At Algolia, I worked on making complex technical knowledge accessible to customers and internal teams. At Alan, I moved further into user research, exploring people’s needs, behaviours, and mental models to inform product decisions. Most recently, at Decathlon, I’ve been researching how designers adopt AI in their actual workflows, while building systems and practices to make research more continuous and accessible across product teams."]],["p",{"style":"margin: 0; font-family: 'Newsreader', Georgia, serif; font-size: clamp(18px, 1.6vw, 20px); line-height: 1.65; text-wrap: pretty"},["Throughout these experiences, one question has kept coming back: How do we make research useful without making everyone dependent on a researcher?"]],["p",{"style":"margin: 0; font-family: 'Newsreader', Georgia, serif; font-size: clamp(18px, 1.6vw, 20px); line-height: 1.65; text-wrap: pretty"},["I’ve built research repositories, introduced continuous discovery rituals, trained product teams, created decision frameworks, and experimented with AI agents that help people frame problems, challenge assumptions, and make better use of existing knowledge."]],["p",{"style":"margin: 0; font-family: 'Newsreader', Georgia, serif; font-size: clamp(18px, 1.6vw, 20px); line-height: 1.65; text-wrap: pretty"},["More recently, that thinking led me to Cassandre, a personal project exploring how established HCI knowledge and AI could help developers identify predictable UX issues before involving human participants. The ambition isn’t to automate user research. It’s to free researchers to focus on what only humans can help us understand."]],["p",{"style":"margin: 0; font-family: 'Newsreader', Georgia, serif; font-size: clamp(18px, 1.6vw, 20px); line-height: 1.65; text-wrap: pretty"},["Why Dust? Because I’ve spent an unreasonable amount of time trying to build what Dust already does. And honestly, it’s been painful."]],["p",{"style":"margin: 0; font-family: 'Newsreader', Georgia, serif; font-size: clamp(18px, 1.6vw, 20px); line-height: 1.65; text-wrap: pretty"},["Not because I particularly enjoy reinventing the wheel, but because I don’t have access to Dust at work. So I’ve been cobbling together AI assistants, research workflows, and knowledge-sharing tools with whatever my company’s systems allow me to use. Which, as it turns out, isn’t much. Even the workarounds need workarounds."]],["p",{"style":"margin: 0; font-family: 'Newsreader', Georgia, serif; font-size: clamp(18px, 1.6vw, 20px); line-height: 1.65; text-wrap: pretty"},["The frustrating part is that I know exactly what I want to build, why it would be useful, and who it could help. But getting the tools to talk to each other, accessing the right knowledge, or simply making something usable by my colleagues can become a project in itself."]],["p",{"style":"margin: 0; font-family: 'Newsreader', Georgia, serif; font-size: clamp(18px, 1.6vw, 20px); line-height: 1.65; text-wrap: pretty"},["That’s why Dust caught my attention. I don’t just understand the problem you’re solving intellectually. I’ve been living it, building around it, and occasionally wanting to scream at my laptop because of it."]],["p",{"style":"margin: 0; font-family: 'Newsreader', Georgia, serif; font-size: clamp(18px, 1.6vw, 20px); line-height: 1.65; text-wrap: pretty"},["And as a researcher, that makes me particularly curious about the gap between what AI makes possible and what people can actually do with it."]],["p",{"style":"margin: 0; font-family: 'Newsreader', Georgia, serif; font-size: clamp(18px, 1.6vw, 20px); line-height: 1.65; text-wrap: pretty"},["I’d love to bring that perspective to Dust: combining hands-on research with the experience of building the systems, habits, and shared capabilities that make research valuable across an organisation."]],["p",{"style":"margin: 0; font-family: 'Newsreader', Georgia, serif; font-size: clamp(18px, 1.6vw, 20px); line-height: 1.65; text-wrap: pretty"},["I’ve put together a dedicated view of my portfolio for Dust. Rather than organising my work chronologically, it connects projects across education, product research, and AI around the questions I’ve spent my career trying to answer."]],["p",{"style":"margin: 0; font-family: 'Newsreader', Georgia, serif; font-size: clamp(18px, 1.6vw, 20px); line-height: 1.65; text-wrap: pretty; font-style: italic; font-weight: 600; font-size: clamp(21px, 2.2vw, 26px)"},["Different jobs. Same obsession."]],["p",{"style":"margin: 0; font-family: 'Newsreader', Georgia, serif; font-size: clamp(18px, 1.6vw, 20px); line-height: 1.65; text-wrap: pretty"},["I’d be delighted to continue that conversation with you."]],["p",{"style":"margin: 0; font-family: 'Newsreader', Georgia, serif; font-size: clamp(18px, 1.6vw, 20px); line-height: 1.65; text-wrap: pretty; margin-top: 8px"},["Best,"]],["p",{"style":"margin: 0; font-family: 'Newsreader', Georgia, serif; font-size: clamp(18px, 1.6vw, 20px); line-height: 1.65; text-wrap: pretty; font-weight: 600"},["Safaa El Ouafi"]],["div",{"style":"display: flex; flex-wrap: wrap; gap: 10px; margin-top: 20px; padding-top: 24px; border-top: 1px solid #E3E3EA"},[["a",{"href":"/Safaa_El_Ouafi_Cover_Letter_Dust.pdf","download":"Safaa_El_Ouafi_Cover_Letter_Dust.pdf","style":"display: inline-flex; align-items: center; min-height: 52px; padding: 0 24px; border-radius: 999px; font-size: 16px; font-weight: 700; text-decoration: none; white-space: nowrap; background: #17171F; color: #FFFFFF"},["Download PDF ↓"]],["a",{"href":"Dust.dc.html","style":"display: inline-flex; align-items: center; min-height: 52px; padding: 0 24px; border-radius: 999px; font-size: 16px; font-weight: 700; text-decoration: none; white-space: nowrap; border: 1px solid #17171F; color: #17171F"},["← Back to Safaa × Dus
