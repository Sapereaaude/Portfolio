77 24h20.45c.98 0 1.78-.77 1.78-1.73V1.73C24 .77 23.2 0 22.22 0z"},[]]]]]],["a",{"href":"mailto:safaa.elouafi.am@gmail.com","aria-label":"Email","style":"display: inline-flex; align-items: center; justify-content: center; width: 44px; height: 44px; border-radius: 50%; color: #17171F; text-decoration: none"},[["svg",{"aria-hidden":"true","width":"24","height":"24","viewBox":"0 0 24 24","fill":"none","stroke":"currentColor","stroke-width":"2","stroke-linejoin":"round"},[["rect",{"x":"3","y":"5","width":"18","height":"14","rx":"2"},[]],["path",{"d":"M3.5 6.5l8.5 6.5 8.5-6.5"},[]]]]]]]]]]]]],"props":{"accent":"#3B5BB8"},"code":"class Component extends DCLogic {\nrenderVals() {\nvar accent = this.props.accent ?? '#3B5BB8';\n/* Same project records as the home page (Main.dc.html). This view only chooses which ones to show. */\nvar items = [\n{ id: 'workshops', pts: ['Created in 2011', 'For children, adults and companies', 'Funded with grants and private money'], vis: 'pot', meta: 'Founder · 2011', title: 'Cultural cooking workshops', q: 'Can cooking together bring cultures closer?', a: 'In 2011 I created a programme of intercultural cooking-and-culture workshops for children, adults and companies. I designed them, brought in cultural and food professionals, and wrote the business plans and funding applications.', jobs: ['side', 'built', 'career'], who: ['curious', 'founder', 'designer'], m: [], sc: [] },\n{ id: 'bsf', pts: ['Volunteer', 'During my Algolia years'], vis: 'library', meta: 'Volunteering · 2019–21', title: 'Bibliothèques Sans Frontières', q: 'Giving time to libraries without borders.', a: 'Volunteer at Bibliothèques Sans Frontières while working at Algolia.', jobs: ['career', 'built'], who: ['curious', 'founder'], m: [], sc: [] },\n{ id: 'algo_academy', pts: ['Curricula for CSMs, sales and onboarding', 'An academy with partner certifications', 'Content tailored to Magento, Crawler…'], vis: 'academy', meta: 'Algolia · Instructional design', title: 'Algolia Academy', q: 'How do partners become certified Algolia experts?', a: 'As instructional designer, I designed the curricula for CSMs, sales and onboarding, and the Algolia Academy with its partner certifications. I worked with product teams like Magento and Crawler on content specific to their products.', jobs: ['built', 'career'], who: ['hiring', 'founder', 'pm', 'designer'], m: [], sc: [] },\n{ id: 'algo_journey', pts: ['Researched with the CSM team', 'From pre-sales to onboarding', 'Where understanding unlocks implementation'], vis: 'journey', meta: 'Algolia · with Customer Success', title: 'The customer learning journey', q: 'When do customers most need to understand, to implement well and churn less?', a: 'With the CSM team, I researched and designed the customer journey to find the moments, from pre-sales to onboarding, where customers most needed to understand, so they would implement better and churn less.', jobs: ['research', 'built'], who: ['founder', 'pm', 'hiring', 'researcher'], m: ['qual'], sc: ['generative', 'strategic'] },\n{ id: 'algo_personas', pts: ['Partners, customers, customer types', 'Internal learners by goal', 'One path per real need'], vis: 'personas', meta: 'Algolia · User research', title: 'Learner personas', q: 'Who is actually learning Algolia, and what do they want from it?', a: 'Learner personas for partners, customers and types of customers, and for Algolia’s own people according to their learning goals.', jobs: ['research', 'built'], who: ['researcher', 'designer', 'pm', 'hiring'], m: ['qual'], sc: ['generative', 'tactical'] },\n{ id: 'sistech', pts: ['Mentor in the Boost programme', 'Refugee and displaced women', 'Toward tech and digital jobs in France'], vis: 'mentor', meta: 'Volunteering · since 2018', title: 'Mentoring at Sistech', q: 'How do refugee women move into tech jobs in France?', a: 'I mentored women in Sistech’s Boost programme, which helps refugee and displaced women retrain toward tech and digital jobs in France.', jobs: ['career', 'built', 'looking'], who: ['curious', 'founder', 'hiring'], m: [], sc: [] },\n{ id: 'vgwb', pts: ['An educational game', 'With Video Games Without Borders', 'For children in refugee camps'], vis: 'game', meta: 'Volunteering · 2017–20', title: 'A game to learn Arabic', q: 'How do children in refugee camps keep learning Arabic?', a: 'With Video Games Without Borders, I helped develop a game for children in refugee camps to learn Arabic.', jobs: ['career', 'built'], who: ['curious', 'designer', 'founder'], m: [], sc: [] },\n{ id: 'daradam', pts: ['Educational cube games', 'Arabic language and culture', 'Contributed to the design'], vis: 'cubes', meta: 'Dar Adam · 2017–20', title: 'Cubes that teach Arabic', q: 'Can a game of cubes teach a language and a culture?', a: 'I contributed to the design of Dar Adam’s educational games: cube games to learn the Arabic language and culture.', jobs: ['career', 'built'], who: ['curious', 'designer'], m: [], sc: [] },\n{ id: 'clinic', pts: ['Mapped the use cases of a medical chat', 'What makes members come back', 'The chat as a bridge, not a gatekeeper'], vis: 'clinic', meta: 'Alan · 2021–22', title: 'Alan Clinic', q: 'How do we make a medical chat the bridge between patients and health professionals?', a: 'Research on how Alan members adopt and engage with Alan Clinic, its different use cases, and how the medical chat could become an ally between patients and their health professionals. [ADD WHAT IT CHANGED]', jobs: ['research', 'built'], who: ['founder', 'pm', 'hiring', 'researcher', 'designer'], m: ['qual'], sc: ['generative', 'strategic'] },\n{ id: 'mind', pts: ['Mental models of therapy in France', 'What stops people from going', 'How the app can lower the barrier'], vis: 'mind', meta: 'Alan · 2021–22', title: 'Alan Mind', q: 'How can an app help destigmatise therapy?', a: 'Studying the mental models of the French population around therapy, to shape how Alan Mind could make seeking help feel normal. [ADD WHAT IT CHANGED]', jobs: ['research', 'built'], who: ['founder', 'researcher', 'pm', 'hiring', 'designer', 'curious'], m: ['qual'], sc: ['generative', 'strategic'] },\n{ id: 'clear', pts: ['A purchase people rarely make blind', 'Where trust breaks online', 'What reassures enough to order'], vis: 'clear', meta: 'Alan · 2022', title: 'Alan Clear', q: 'How do you buy glasses without trying them on?', a: 'Research for Alan Clear on buying glasses online, without the fitting-room moment. [ADD METHOD AND WHAT IT CHANGED]', jobs: ['research', 'built'], who: ['designer', 'pm', 'founder', 'researcher'], m: ['qual'], sc: ['evaluative', 'tactical'] },\n{ id: 'plm', pts: ['1,000+ engineers, one product lifecycle', 'From the idea to recycling', 'A huge programme with Dassault'], vis: 'plm', meta: 'Decathlon · 2023–25', title: 'Idea to recycling', q: 'How do more than a thousand engineers keep a product’s life in order, from idea to recycling?', a: 'Research on how engineers maintain the lifecycle of a product, inside a huge programme with Dassault: components, bills of materials, data trust, versioning, access rights, eco-design. [ADD WHAT IT CHANGED]', jobs: ['research', 'built'], who: ['pm', 'researcher', 'hiring', 'founder'], m: ['mixed'], sc: ['generative', 'strategic'] },\n{ id: 'stress', pts: ['Measuring learners’ stress', 'Looking for what predicts success', 'Adapting conditions to help them through'], vis: 'stress', meta: 'RBK Jordan · 2017–18', title: 'Stress & success', q: 'Can measuring bootcamp students’ stress reveal what helps them succeed?', a: 'Measuring the stress of learners during an intensive coding bootcamp, to identify success criteria and adapt their conditions. [ADD METHOD AND FINDINGS]', jobs: ['research', 'career', 'built'], who: ['researcher', 'founder', 'curious', 'hiring'], m: ['quant'], sc: ['generative', 'strategic'] },\n{ id: 'tracking', pts: ['Daily tracking: mood, food, sleep, sport', 'A weekly analysis, confounders flagged', 'A data mind turned on itself'], vis: 'tracking', meta: 'Personal project · 2026', title: 'Tracking Bad', q: 'Can a data-driven mind turn its obsession into care for its own mental health?', a: 'I track my own days and analyse them every week to find the factors that support my mental health. The researcher is also the participant.', jobs: ['side', 'research', 'ai', 'built'], who: ['curious', 'researcher', 'founder'], m: ['quant'], sc: ['generative'] },\n{ id: 'aiid', pts: ['Survey + heatmaps by seniority', 'Profiles: self-taught explorers, curious but blocked', 'Became a programme, shared with 300–400 designers'], vis: 'slide', meta: 'Decathlon · 2025', title: 'AI in Design', q: 'How do industrial designers really bring AI into their creative work?', a: 'A community survey with heatmaps by seniority, profiles like \"self-taught explorers\" and \"curious but blocked\", then interviews. The barrier wasn’t the tech, it was not knowing which tool to use. So the project became a programme: licences, training, a sandbox. Presented to 300–400 designers.', jobs: ['built', 'research', 'ai'], who: ['hiring', 'designer', 'pm', 'founder', 'researcher'], m: ['mixed'], sc: ['generative', 'strategic'] },\n{ id: 'vizcom', pts: ['20 designers, 3 months, one shared diary', 'Biweekly check-ins, monthly moderated tests', 'Some said they wouldn’t go back'], vis: 'finding', meta: 'Decathlon · 2025', title: 'After the demo effect', q: 'What happens to an AI tool once the wow wears off?', a: 'A 3-month diary study with 20 designers using an AI sketch-to-3D tool: a shared diary, biweekly check-ins, a chat channel and monthly moderated tests. Some said they wouldn’t go back.', jobs: ['research', 'ai', 'built'], who: ['researcher', 'designer', 'founder', 'hiring'], m: ['qual'], sc: ['evaluative', 'tactical'] },\n{ id: 'system', pts: ['A 3-week study on how teams use user knowledge', 'One atomic research repository', 'A monthly Research Grooming before sprints'], vis: 'repo', meta: 'Decathlon · 2023–24', title: 'A research system for 5 teams', q: 'How do five product teams stop losing what they learn about users?', a: 'A 3-week study on how teams collect user knowledge, then one atomic research repository, a monthly Research Grooming before sprint planning, and weekly office hours.', jobs: ['built', 'research'], who: ['hiring', 'researcher', 'pm', 'founder'], m: ['mixed'], sc: ['generative', 'strategic'] },\n{ id: 'prio', pts: ['Sports leaders, PMOs and PMs interviewed', 'Analysed with atomic research', 'Then: how engineers actually plan'], vis: 'report', meta: 'Decathlon · 2025', title: 'How products get chosen', q: 'Who really decides which products get developed?', a: 'Interviews with sports leaders, PMOs and product managers, analysed with atomic research, then a second round with product engineers on how they actually plan.', jobs: ['research', 'built'], who: ['pm', 'researcher', 'hiring', 'founder'], m: ['qual'], sc: ['generative', 'strategic'] },\n{ id: 'sat3d', pts: ['One week to answer, one to analyse', 'A one-hour workshop to decide the fixes', 'Run every month with a product designer'], vis: 'monthly', meta: 'Decathlon · 2025', title: 'A monthly pulse on 3D tools', q: 'Are bike designers, engineers and 3D modellers happy with their tools, month after month?', a: 'With a product designer: a monthly survey, one week to answer, one week to analyse, then a one-hour workshop to decide what to fix.', jobs: ['research', 'built'], who: ['researcher', 'designer', 'pm', 'hiring'], m: ['quant'], sc: ['evaluative', 'tactical'] },\n{ id: 'usab', pts: ['CSUQ scores and task success', 'Three tiers anyone can read', 'The verdict in ten seconds'], vis: 'tiers', meta: 'Usability practice', title: 'Usability, readable in one glance', q: 'How do you make a usability verdict readable in ten seconds?', a: 'CSUQ scores and success rate per task, split into three tiers anyone can read. The detail is there for whoever wants ten minutes more.', jobs: ['research', 'built'], who: ['researcher', 'designer', 'pm'], m: ['mixed'], sc: ['evaluative', 'tactical'] },\n{ id: 'agents', pts: ['Metis frames problems for PMs', 'Sophia mentors researchers', 'Helix turns user knowledge into monthly insights'], vis: 'chat', meta: 'Built for my teams', title: 'A small pantheon of agents', q: 'How do I help more teams than I have hours?', a: 'I built them colleagues. Metis helps PMs frame a problem and decide if they need discovery. Sophia mentors researchers. Helix turns ongoing user knowledge into monthly insights.', jobs: ['built', 'ai'], who: ['founder', 'pm', 'researcher', 'hiring', 'designer'], m: [], sc: [] },\n{ id: 'swiss', pts: ['Ten questions every transcript must answer', 'AI runs them, a human decides', 'Faster, and still rigorous'], vis: 'sheet', meta: 'AI-assisted research', title: 'The ten-question Swiss knife', q: 'How do you analyse interviews faster without losing rigour?', a: 'Ten questions every transcript must answer, from context and workarounds to emotional cues, surprises and gaps. AI runs them, a human decides what matters.', jobs: ['research', 'ai', 'built'], who: ['researcher', 'designer', 'pm'], m: ['qual'], sc: ['tactical'] },\n{ id: 'community', pts: ['~20 researchers, 4 cities', 'An AI-for-UXR toolkit', 'UX Therapy, a weekly ritual'], vis: 'channel', meta: 'Decathlon · 2025', title: 'One community, four cities', q: 'How do ~20 researchers spread across four cities become a team?', a: 'A shared space, an AI-for-UXR toolkit, a first in-person day, and UX Therapy, a weekly ritual with the designers.', jobs: ['built', 'research'], who: ['researcher', 'hiring', 'designer'], m: [], sc: [] },\n{ id: 'superpowers', pts: ['List your superpowers and what you want to grow', 'Matched by domain, format and place', 'No swiping: too inhumane'], vis: 'matchscreen', meta: 'Decathlon · pitched 2023', title: 'Superpowers Directory', q: 'How do designers find the right mentor inside a huge company?', a: 'List your superpowers and what you want to grow, get matched by domain, format and place, then message. I polled the community first, and rejected swiping as inhumane.', jobs: ['built'], who: ['designer', 'founder', 'curious'], m: ['quant'], sc: ['generative'] },\n{ id: 'bastille', pts: ['Swipe ideas, not candidates', 'Measures sourced from official programmes', 'Mini-games to learn without a lecture'], vis: 'bastille', meta: 'Side project · 2026', title: 'Bastille', q: 'How do we help French citizens vote with full awareness, not by reflex?', a: 'Swipe anonymised measures taken from official programmes for the 2027 French election. The matching never invents a position. Built with Claude, now in Lovable.', jobs: ['side', 'built', 'ai'], who: ['founder', 'designer', 'pm', 'curious'], m: [], sc: ['generative'] },\n{ id: 'palier', pts: ['No phone numbers, no emails', 'Pet sitter, works, a party next door', '“I have your parcel”'], vis: 'palier', meta: 'Side project', title: 'Le Palier', q: 'How can neighbours in the same building talk without sharing their contact details?', a: 'An app for the people of one building to pass on what matters: I need a pet sitter, there will be works, I am throwing a party, I have your parcel. No numbers or emails exchanged.', jobs: ['side', 'built'], who: ['designer', 'founder', 'pm', 'curious'], m: [], sc: ['generative'] },\n{ id: 'askip', pts: ['One card a day', 'Answers revealed when both have played'], vis: 'askip', appName: 'ASKIP', meta: 'Side project · 2026', title: 'Askip', q: 'How do couples keep discovering each other?', a: 'One card a day. Your answer is revealed only once your partner has played too.', jobs: ['side', 'built'], who: ['designer', 'founder', 'curious'], m: [], sc: [] },\n{ id: 'oasis', pts: ['Cool places and water fountains', 'Free, public utility'], vis: 'oasis', appName: 'OASIS SPOT', meta: 'Side project · 2026', title: 'Oasis Spot', q: 'Where can I cool down when the city is boiling?', a: 'A free map of cool places and water fountains for heatwaves. Public utility, no catch.', jobs: ['side', 'built'], who: ['designer', 'founder', 'curious'], m: [], sc: [] },\n{ id: 'papier', pts: ['One book, one recipe tested', 'One reflective text'], vis: 'book', quote: 'Le papier mâché', meta: 'Instagram · 2026', title: 'Le papier mâché', q: 'What if cookbooks were reviewed like poetry?', a: 'One book, one recipe tested, one reflective text. I collect cookbooks; someone had to read them properly.', jobs: ['side', 'built'], who: ['curious'], m: [], sc: [] },\n{ id: 'programme', pts: ['Set up the programmes', 'Improved them from one cohort to the next', 'Learners and employers at the centre'], vis: 'loop', meta: 'Programme manager · RBK, Next Academy, Simplon', title: 'Better from cohort to cohort', q: 'How does a bootcamp get better with every cohort?', a: 'Each cohort teaches you how to run the next one, if you listen.', jobs: ['career', 'built'], who: ['hiring', 'founder', 'curious'], m: [], sc: [] },\n{ id: 'cassandre', pts: ['Predictable UX issues, checked before human research', 'HCI knowledge, accessibility criteria, heuristics', 'A prototype, not a validated product'], vis: 'sheet', meta: 'Side project · prototype · 2026', title: 'Cassandre', q: 'Which UX problems can be caught before involving a single participant?', a: 'A UX pretesting tool for developers and product teams. Test what you can. Research what you can’t.', jobs: ['side', 'ai', 'built'], who: ['founder', 'researcher', 'pm', 'designer', 'hiring'], m: [], sc: [] },\n{ id: 'rbk', pts: ['Rebuilt the programme after a rough first cohort', '3 cohorts of about 30', '1:1s, speaking and restorative justice circles'], vis: 'grads', meta: 'RBK Jordan · 2017–18', title: 'Refugees to software engineers', q: 'Can a bootcamp turn refugees into software engineers?', a: 'I audited and rebuilt the programme, led educators across three cohorts, added English and digital literacy from employer feedback, and ran 1:1s, speaking circles and restorative justice circles. The one I’m proudest of.', jobs: ['career', 'built'], who: ['hiring', 'founder', 'curious', 'pm'], m: [], sc: [] },\n{ id: 'teach', pts: ['Arabic, then French', 'From three-year-olds to engineers at Thales', 'Then the French Embassy in Amman'], vis: 'chalk', hl: [0, 1], meta: '2008–2016', title: 'Teacher, then Amman', q: 'What did teaching teach me?', a: 'Arabic, then French, to children and adults, employees in companies and pupils in state schools, from three-year-olds to engineers at Thales. Then French teacher and coordinator at the French Embassy in Amman, also working with the Institut français. Understand where someone really is before deciding where to take them. That turned out to be research.', jobs: ['career'], who: ['curious', 'hiring'], m: [], sc: [] },\n{ id: 'simplon', pts: ['Next Academy in Kuala Lumpur and Singapore', 'Hiring partnerships at Simplon', 'Orange, Microsoft, Apple and more'], vis: 'job', hl: [3], meta: '2018', title: 'Kuala Lumpur, Singapore, Paris', q: 'How do learners leave a bootcamp with a job?', a: 'At Next Academy, then at Simplon: hiring partnerships with Orange, Microsoft, Capgemini, Malakoff Humanis, Accenture and Apple.', jobs: ['career'], who: ['hiring', 'curious'], m: [], sc: [] },\n{ id: 'tech', pts: ['Algolia: next to Sales and CS', 'Alan: mental health and care', 'Decathlon: tools for product creation'], vis: 'timeline', hl: [4, 5, 6], meta: '2019–now', title: 'Algolia, Alan, Decathlon', q: 'What did tech add to the teacher?', a: 'Instructional design, then user research at Algolia, next to Sales and Customer Success. Mental health, care and glasses at Alan. Tools for product creation at Decathlon.', jobs: ['career'], who: ['hiring', 'founder', 'pm', 'researcher'], m: [], sc: [] },\n{ id: 'asp1', pts: ['A bar that’s shared', 'Work that changes something real'], vis: 'balance', quote: 'Rigour and heart, same room', meta: 'What I’m looking for', title: 'Rigour and heart', q: 'Why not just pick one?', a: 'Mission-driven places often forgive sloppiness. Rigorous places are often rigorous about something hollow. I want a team where the bar is shared and the work changes something real.', jobs: ['looking'], who: ['hiring', 'founder', 'curious'], m: [], sc: [] },\n{ id: 'asp2', pts: ['Framing before the roadmap', 'Docs first, then meetings'], vis: 'doc', quote: 'Upstream, written first', meta: 'What I’m looking for', title: 'Upstream, written first', q: 'Where am I most useful?', a: 'Framing the problem before the roadmap does. Docs first, then meetings. In an office: I like offices.', jobs: ['looking'], who: ['hiring', 'pm', 'founder'], m: [], sc: [] },\n{ id: 'asp3', pts: ['Displaced and vulnerable people', 'Mental health'], vis: 'home', quote: 'For people losing their place', meta: 'What I’m looking for', title: 'Tech for people losing their place', q: 'Where does research have the most to give?', a: 'Displaced people, vulnerable people, mental health. Jordan taught me what it looks like when lives visibly improve. I want that again.', jobs: ['looking'], who: ['founder', 'curious', 'hiring'], m: [], sc: [] },\n{ id: 'ph1', pts: ['Morocco', 'Food and family, in warm colours'], vis: 'photo', meta: 'Morocco', title: 'Msemmen de Proust', q: 'What does a memory taste like?', a: 'Family and food, in warm colours. The madeleine, but Moroccan.', jobs: ['photo'], who: ['curious', 'designer'], m: [], sc: [] },\n{ id: 'ph3', pts: ['Paris', 'Habitation non incluse'], vis: 'photo', meta: 'Paris', title: 'Assurance habitation, habitation non incluse*', q: 'Who is left out of the promise?', a: 'A man asleep under a home insurance ad. Habitation non incluse.', jobs: ['photo'], who: ['curious', 'designer'], m: [], sc: [] },\n{ id: 'ph4', pts: ['Djerba, 2026', 'Absence, then life coming back'], vis: 'photo', meta: 'Djerba · 2026', title: 'Le village s’endort', q: 'Can absence be a portrait?', a: 'The Jewish quarter at the end of shabbat: closed doors, then children, lights and prayers coming back.', jobs: ['photo'], who: ['curious',
