 own people according to their learning goals.\"}]}, {\"id\": \"alan\", \"name\": \"Alan\", \"years\": \"2021–22\", \"place\": \"Paris\", \"projects\": [{\"id\": \"clinic\", \"t\": \"Alan Clinic\", \"m\": \"Alan · 2021–22\", \"q\": \"How do we make a medical chat the bridge between patients and health professionals?\", \"p\": [\"Mapped the use cases of a medical chat\", \"What makes members come back\", \"The chat as a bridge, not a gatekeeper\"], \"a\": \"Research on how Alan members adopt and engage with Alan Clinic, its different use cases, and how the medical chat could become an ally between patients and their health professionals. [ADD WHAT IT CHANGED]\"}, {\"id\": \"mind\", \"t\": \"Alan Mind\", \"m\": \"Alan · 2021–22\", \"q\": \"How can an app help destigmatise therapy?\", \"p\": [\"Mental models of therapy in France\", \"What stops people from going\", \"How the app can lower the barrier\"], \"a\": \"Studying the mental models of the French population around therapy, to shape how Alan Mind could make seeking help feel normal. [ADD WHAT IT CHANGED]\"}, {\"id\": \"clear\", \"t\": \"Alan Clear\", \"m\": \"Alan · 2022\", \"q\": \"How do you buy glasses without trying them on?\", \"p\": [\"A purchase people rarely make blind\", \"Where trust breaks online\", \"What reassures enough to order\"], \"a\": \"Research for Alan Clear on buying glasses online, without the fitting-room moment. [ADD METHOD AND WHAT IT CHANGED]\"}]}, {\"id\": \"decathlon\", \"name\": \"Decathlon\", \"years\": \"2023–now\", \"place\": \"Paris · Lille\", \"projects\": [{\"id\": \"aiid\", \"t\": \"AI in Design\", \"m\": \"Decathlon · 2025\", \"q\": \"How do industrial designers really bring AI into their creative work?\", \"p\": [\"Survey + heatmaps by seniority\", \"Profiles: self-taught explorers, curious but blocked\", \"Became a programme, shared with 300–400 designers\"], \"a\": \"A community survey with heatmaps by seniority, profiles like \\\"self-taught explorers\\\" and \\\"curious but blocked\\\", then interviews. The barrier wasn’t the tech, it was not knowing which tool to use. So the project became a programme: licences, training, a sandbox. Presented to 300–400 designers.\"}, {\"id\": \"vizcom\", \"t\": \"After the demo effect\", \"m\": \"Decathlon · 2025\", \"q\": \"What happens to an AI tool once the wow wears off?\", \"p\": [\"20 designers, 3 months, one shared diary\", \"Biweekly check-ins, monthly moderated tests\", \"Some said they wouldn’t go back\"], \"a\": \"A 3-month diary study with 20 designers using an AI sketch-to-3D tool: a shared diary, biweekly check-ins, a chat channel and monthly moderated tests. Some said they wouldn’t go back.\"}, {\"id\": \"system\", \"t\": \"A research system for 5 teams\", \"m\": \"Decathlon · 2023–24\", \"q\": \"How do five product teams stop losing what they learn about users?\", \"p\": [\"A 3-week study on how teams use user knowledge\", \"One atomic research repository\", \"A monthly Research Grooming before sprints\"], \"a\": \"A 3-week study on how teams collect user knowledge, then one atomic research repository, a monthly Research Grooming before sprint planning, and weekly office hours.\"}, {\"id\": \"prio\", \"t\": \"How products get chosen\", \"m\": \"Decathlon · 2025\", \"q\": \"Who really decides which products get developed?\", \"p\": [\"Sports leaders, PMOs and PMs interviewed\", \"Analysed with atomic research\", \"Then: how engineers actually plan\"], \"a\": \"Interviews with sports leaders, PMOs and product managers, analysed with atomic research, then a second round with product engineers on how they actually plan.\"}, {\"id\": \"plm\", \"t\": \"Idea to recycling\", \"m\": \"Decathlon · 2023–25\", \"q\": \"How do more than a thousand engineers keep a product’s life in order, from idea to recycling?\", \"p\": [\"1,000+ engineers, one product lifecycle\", \"From the idea to recycling\", \"A huge programme with Dassault\"], \"a\": \"Research on how engineers maintain the lifecycle of a product, inside a huge programme with Dassault: components, bills of materials, data trust, versioning, access rights, eco-design. [ADD WHAT IT CHANGED]\"}, {\"id\": \"sat3d\", \"t\": \"A monthly pulse on 3D tools\", \"m\": \"Decathlon · 2025\", \"q\": \"Are bike designers, engineers and 3D modellers happy with their tools, month after month?\", \"p\": [\"One week to answer, one to analyse\", \"A one-hour workshop to decide the fixes\", \"Run every month with a product designer\"], \"a\": \"With a product designer: a monthly survey, one week to answer, one week to analyse, then a one-hour workshop to decide what to fix.\"}, {\"id\": \"usab\", \"t\": \"Usability, readable in one glance\", \"m\": \"Usability practice\", \"q\": \"How do you make a usability verdict readable in ten seconds?\", \"p\": [\"CSUQ scores and task success\", \"Three tiers anyone can read\", \"The verdict in ten seconds\"], \"a\": \"CSUQ scores and success rate per task, split into three tiers anyone can read. The detail is there for whoever wants ten minutes more.\"}, {\"id\": \"agents\", \"t\": \"A small pantheon of agents\", \"m\": \"Built for my teams\", \"q\": \"How do I help more teams than I have hours?\", \"p\": [\"Metis frames problems for PMs\", \"Sophia mentors researchers\", \"Helix turns user knowledge into monthly insights\"], \"a\": \"I built them colleagues. Metis helps PMs frame a problem and decide if they need discovery. Sophia mentors researchers. Helix turns ongoing user knowledge into monthly insights.\"}, {\"id\": \"swiss\", \"t\": \"The ten-question Swiss knife\", \"m\": \"AI-assisted research\", \"q\": \"How do you analyse interviews faster without losing rigour?\", \"p\": [\"Ten questions every transcript must answer\", \"AI runs them, a human decides\", \"Faster, and still rigorous\"], \"a\": \"Ten questions every transcript must answer, from context and workarounds to emotional cues, surprises and gaps. AI runs them, a human decides what matters.\"}, {\"id\": \"community\", \"t\": \"One community, four cities\", \"m\": \"Decathlon · 2025\", \"q\": \"How do ~20 researchers spread across four cities become a team?\", \"p\": [\"~20 researchers, 4 cities\", \"An AI-for-UXR toolkit\", \"UX Therapy, a weekly ritual\"], \"a\": \"A shared space, an AI-for-UXR toolkit, a first in-person day, and UX Therapy, a weekly ritual with the designers.\"}, {\"id\": \"superpowers\", \"t\": \"Superpowers Directory\", \"m\": \"Decathlon · pitched 2023\", \"q\": \"How do designers find the right mentor inside a huge company?\", \"p\": [\"List your superpowers and what you want to grow\", \"Matched by domain, format and place\", \"No swiping: too inhumane\"], \"a\": \"List your superpowers and what you want to grow, get matched by domain, format and place, then message. I polled the community first, and rejected swiping as inhumane.\"}]}, {\"id\": \"alongside\", \"name\": \"Alongside\", \"years\": \"Always\", \"place\": \"Volunteering & side projects\", \"projects\": [{\"id\": \"workshops\", \"t\": \"Cultural cooking workshops\", \"m\": \"Founder · 2011\", \"q\": \"Can cooking together bring cultures closer?\", \"p\": [\"Created in 2011\", \"For children, adults and companies\", \"Funded with grants and private money\"], \"a\": \"In 2011 I created a programme of intercultural cooking-and-culture workshops for children, adults and companies. I designed them, brought in cultural and food professionals, and wrote the business plans and funding applications.\"}, {\"id\": \"vgwb\", \"t\": \"A game to learn Arabic\", \"m\": \"Volunteering · 2017–20\", \"q\": \"How do children in refugee camps keep learning Arabic?\", \"p\": [\"An educational game\", \"With Video Games Without Borders\", \"For children in refugee camps\"], \"a\": \"With Video Games Without Borders, I helped develop a game for children in refugee camps to learn Arabic.\"}, {\"id\": \"daradam\", \"t\": \"Cubes that teach Arabic\", \"m\": \"Dar Adam · 2017–20\", \"q\": \"Can a game of cubes teach a language and a culture?\", \"p\": [\"Educational cube games\", \"Arabic language and culture\", \"Contributed to the design\"], \"a\": \"I contributed to the design of Dar Adam’s educational games: cube games to learn the Arabic language and culture.\"}, {\"id\": \"sistech\", \"t\": \"Mentoring at Sistech\", \"m\": \"Volunteering · since 2018\", \"q\": \"How do refugee women move into tech jobs in France?\", \"p\": [\"Mentor in the Boost programme\", \"Refugee and displaced women\", \"Toward tech and digital jobs in France\"], \"a\": \"I mentored women in Sistech’s Boost programme, which helps refugee and displaced women retrain toward tech and digital jobs in France.\"}, {\"id\": \"bsf\", \"t\": \"Bibliothèques Sans Frontières\", \"m\": \"Volunteering · 2019–21\", \"q\": \"Giving time to libraries without borders.\", \"p\": [\"Volunteer\", \"During my Algolia years\"], \"a\": \"Volunteer at Bibliothèques Sans Frontières while working at Algolia.\"}, {\"id\": \"tracking\", \"t\": \"Tracking Bad\", \"m\": \"Personal project · 2026\", \"q\": \"Can a data-driven mind turn its obsession into care for its own mental health?\", \"p\": [\"Daily tracking: mood, food, sleep, sport\", \"A weekly analysis, confounders flagged\", \"A data mind turned on itself\"], \"a\": \"I track my own days and analyse them every week to find the factors that support my mental health. The researcher is also the participant.\"}, {\"id\": \"bastille\", \"t\": \"Bastille\", \"m\": \"Side project · 2026\", \"q\": \"How do we help French citizens vote with full awareness, not by reflex?\", \"p\": [\"Swipe ideas, not candidates\", \"Measures sourced from official programmes\", \"Mini-games to learn without a lecture\"], \"a\": \"Swipe anonymised measures taken from official programmes for the 2027 French election. The matching never invents a position. Built with Claude, now in Lovable.\"}, {\"id\": \"palier\", \"t\": \"Le Palier\", \"m\": \"Side project\", \"q\": \"How can neighbours in the same building talk without sharing their contact details?\", \"p\": [\"No phone numbers, no emails\", \"Pet sitter, works, a party next door\", \"“I have your parcel”\"], \"a\": \"An app for the people of one building to pass on what matters: I need a pet sitter, there will be works, I am throwing a party, I have your parcel. No numbers or emails exchanged.\"}, {\"id\": \"askip\", \"t\": \"Askip\", \"m\": \"Side project · 2026\", \"q\": \"How do couples keep discovering each other?\", \"p\": [\"One card a day\", \"Answers revealed when both have played\"], \"a\": \"One card a day. Your answer is revealed only once your partner has played too.\"}, {\"id\": \"oasis\", \"t\": \"Oasis Spot\", \"m\": \"Side project · 2026\", \"q\": \"Where can I cool down when the city is boiling?\", \"p\": [\"Cool places and water fountains\", \"Free, public utility\"], \"a\": \"A free map of cool places and water fountains for heatwaves. Public utility, no catch.\"}, {\"id\": \"papier\", \"t\": \"Le papier mâché\", \"m\": \"Instagram · 2026\", \"q\": \"What if cookbooks were reviewed like poetry?\", \"p\": [\"One book, one recipe tested\", \"One reflective text\"], \"a\": \"One book, one recipe tested, one reflective text. I collect cookbooks; someone had to read them properly.\"}]}];\nvar MARKERS = [{\"col\": 0, \"y\": \"2011\", \"l\": \"Cooking workshops\", \"p\": \"workshops\"}, {\"col\": 2, \"y\": \"2017–20\", \"l\": \"Arabic learning games\", \"p\": \"vgwb\"}, {\"col\": 3, \"y\": \"2018 →\", \"l\": \"Sistech\", \"p\": \"sistech\"}, {\"col\": 4, \"y\": \"2019–21\", \"l\": \"Bibliothèques Sans Frontières\", \"p\": \"bsf\"}, {\"col\": 6, \"y\": \"2025–26\", \"l\": \"Side projects\", \"p\": null}];\nvar company = COMPANIES.find(function (c) { return c.id === s.company; }) || COMPANIES[0];\nvar MAIN = COMPANIES.filter(function (c) { return c.id !== 'alongside'; });\nvar stops = MAIN.map(function (c) {\nvar on = c.id === company.id;\nreturn {\nname: c.name, years: c.years, on: on,\nc
