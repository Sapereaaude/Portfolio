<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Off the map · Safaa El Ouafi</title>
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Figtree:wght@400;600;700&family=Newsreader:ital,opsz,wght@1,6..72,400&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
html,body{margin:0;background:#FFFFFF;color:#17171F;font-family:Figtree,system-ui,sans-serif}
a{color:#17171F}a:hover{color:#3B5BB8}
:focus-visible{outline:3px solid #3B5BB8;outline-offset:2px}
.wrap{max-width:1280px;margin:0 auto;padding:20px clamp(20px,4vw,56px) 48px}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;padding-bottom:14px;border-bottom:1px solid #E3E3EA;font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase}
.top a{text-decoration:none;white-space:nowrap}
.eyebrow{margin:clamp(28px,5vw,56px) 0 0;font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:#D13A28}
h1{margin:10px 0 0;font-family:Anton,Impact,sans-serif;font-weight:400;font-size:clamp(48px,9vw,120px);line-height:.95;text-transform:uppercase}
h1 span{color:#D13A28}
.sub{margin:14px 0 0;max-width:760px;text-wrap:balance;font-family:Newsreader,Georgia,serif;font-style:italic;font-size:clamp(20px,2.4vw,28px);line-height:1.3;text-wrap:pretty}
.map{position:relative;margin:clamp(12px,3vw,32px) 0 0}
@media (max-width:760px){.map{margin-left:calc(-1 * clamp(20px,4vw,56px));margin-right:calc(-1 * clamp(20px,4vw,56px));overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none}.map::-webkit-scrollbar{display:none}.wrap .map > svg{width:900px;max-width:none}}
.hint{display:none;margin:6px 0 0;font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:#4A4A57}
@media (max-width:760px){.hint{display:block}}
.map svg{display:block;width:100%;height:auto;overflow:visible}
.dot{transition:fill .25s ease}
.pin{cursor:pointer;outline:none}
.pin .stem{stroke:#17171F;stroke-width:1.4}
.pin .head{fill:#D13A28;stroke:#FFFFFF;stroke-width:2;transition:transform .2s ease}
.pin .base{fill:rgba(23,23,31,.18)}
.pin:hover .head,.pin:focus-visible .head,.pin.on .head{transform:scale(1.35)}
.pin text{font-family:Figtree,sans-serif;font-weight:700;font-size:13px;fill:#17171F;opacity:0;transition:opacity .15s ease;pointer-events:none;paint-order:stroke;stroke:#FFFFFF;stroke-width:5px;stroke-linejoin:round}
.pin:hover text,.pin:focus-visible text,.pin.on text{opacity:1}
.list{display:flex;flex-wrap:wrap;gap:8px;margin:clamp(16px,3vw,28px) 0 0;padding:0;list-style:none}
.list button{min-height:36px;padding:0 14px;border:1px solid #D5D7E0;border-radius:999px;background:#FFFFFF;color:#17171F;font:600 13px/1 Figtree,sans-serif;white-space:nowrap;cursor:pointer;transition:border-color .15s ease,background-color .15s ease,color .15s ease}
.list button:hover,.list button[aria-pressed="true"]{border-color:#3B5BB8;background:#EEF1FA}
.list .region{background:#3B5BB8;border-color:#3B5BB8;color:#FFFFFF}
.list .region:hover,.list .region[aria-pressed="true"]{background:#17171F;border-color:#17171F;color:#FFFFFF}
.note{margin:18px 0 0;font-size:13px;color:#4A4A57}
@keyframes rise{from{opacity:0}to{opacity:1}}
@keyframes drop{from{opacity:0;transform:translateY(-18px)}to{opacity:1;transform:none}}
.dot{animation:rise .6s ease-out both}
.pin{animation:drop .5s cubic-bezier(.2,.9,.3,1.2) both}
@media (prefers-reduced-motion: reduce){.dot,.pin{animation:none}.pin .head{transition:none}}
</style>
</head>
<body>
<div class="wrap">
<nav class="top"><a href="/about">← About me</a><span>You found the paper plane</span></nav>
<p class="eyebrow">Unexpected user behaviour · 03</p>
<h1>Off the map<span>.</span></h1>
<p class="sub">Every place I’ve set foot in, so far. Tap a pin, or a name below.</p>
<div class="map" id="map" role="img" aria-label="An isometric dot map of the world. The countries I have been to are blue, with a red pin on each place."></div>
<p class="hint" aria-hidden="true">← Swipe the map →</p>
<ul class="list" id="list" aria-label="Places"></ul>
<p class="note">So far. The plane is still flying.</p>
</div>
<script src="/off-the-map/dots.js"></script>
<script>
(function () {
  'use strict';
  /* ── the places: edit here ── */
  var COUNTRIES = ['France', 'Jordan', 'Palestine', 'Lebanon', 'Qatar', 'Singapore', 'Malaysia', 'Vietnam', 'Thailand', 'China', 'Indonesia', 'Morocco', 'Tunisia'];
  var EUROPE = ['Spain', 'Portugal', 'Italy', 'Germany', 'Belgium', 'Netherlands', 'Luxembourg', 'Switzerland', 'Austria', 'United Kingdom', 'Ireland',
    'Denmark', 'Sweden', 'Norway', 'Finland', 'Iceland', 'Poland', 'Czechia', 'Slovakia', 'Hungary', 'Slovenia', 'Croatia', 'Bosnia and Herz.',
    'Serbia', 'Montenegro', 'Albania', 'Macedonia', 'North Macedonia', 'Greece', 'Bulgaria', 'Romania', 'Estonia', 'Latvia', 'Lithuania', 'Malta', 'Cyprus'];
  var PINS = [  // label, lon, lat
    ['France', 2.35, 48.86], ['Europe, almost everywhere', 13.4, 50.5],
    ['Morocco', -6.84, 33.97], ['Tunisia', 10.86, 33.8],
    ['Jordan', 35.93, 31.95], ['Palestine', 35.2, 31.9], ['Lebanon', 35.5, 33.89], ['Qatar', 51.53, 25.29],
    ['China', 104.07, 30.67], ['Vietnam', 105.85, 21.03], ['Thailand', 100.5, 13.75],
    ['Malaysia', 101.69, 3.14], ['Singapore', 103.82, 1.35], ['Indonesia', 106.85, -6.2],
    ['San Francisco', -122.42, 37.77], ['Miami', -80.19, 25.76]
  ];

  var G = window.PLACES_GRID, ACCENT = '#3B5BB8', LAND = '#D5D7E0';
  var reduce = false;
  try { reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches; } catch (e) {}
  var visited = {};
  COUNTRIES.concat(EUROPE).forEach(function (n) { visited[n] = true; });

  /* plane → screen: a gentle isometric tilt (rotate, then squash) */
  var CELL = 10, ROT = -16 * Math.PI / 180, SQ = 0.56, cos = Math.cos(ROT), sin = Math.sin(ROT);
  function proj(x, y) { return [x * cos - y * sin, (x * sin + y * cos) * SQ]; }
  function fromLonLat(lon, lat) { return proj((lon + 180) / G.step * CELL, (G.top - lat) / G.step * CELL); }

  var pts = [];
  for (var i = 0; i < G.dots.length; i += 3) {
    var p = proj((G.dots[i] + 0.5) * CELL, (G.dots[i + 1] + 0.5) * CELL);
    pts.push({ x: p[0], y: p[1], on: !!visited[G.names[G.dots[i + 2]]], col: G.dots[i] });
  }
  var minX = Infinity, maxX = -Infinity, minY = Infinity, maxY = -Infinity;
  pts.forEach(function (q) { minX = Math.min(minX, q.x); maxX = Math.max(maxX, q.x); minY = Math.min(minY, q.y); maxY = Math.max(maxY, q.y); });
  var PAD = 40, TOPPAD = 60;
  var W = maxX - minX + PAD * 2, H = maxY - minY + PAD + TOPPAD;
  function sx(x) { return (x - minX + PAD).toFixed(1); }
  function sy(y) { return (y - minY + TOPPAD).toFixed(1); }

  var NS = 'http://www.w3.org/2000/svg';
  var svg = document.createElementNS(NS, 'svg');
  svg.setAttribute('viewBox', '0 0 ' + W.toFixed(0) + ' ' + H.toFixed(0));
  svg.setAttribute('aria-hidden', 'true');
  var dots = '';
  pts.forEach(function (q) {
    var delay = reduce ? 0 : (q.col / 180 * 0.9).toFixed(2);
    dots += '<ellipse class="dot" cx="' + sx(q.x) + '" cy="' + sy(q.y) + '" rx="3.3" ry="1.95" fill="' + (q.on ? ACCENT : LAND) + '" style="animation-delay:' + delay + 's"></ellipse>';
  });
  svg.innerHTML = '<g>' + dots + '</g>';

  var pins = PINS.map(function (p, k) {
    var s = fromLonLat(p[1], p[2]);
    return { label: p[0], x: +sx(s[0]), y: +sy(s[1]), k: k };
  }).sort(function (a, b) { return a.y - b.y; });
  var STEM = 26;
  pins.forEach(function (p, n) {
    var g = document.createElementNS(NS, 'g');
    g.setAttribute('class', 'pin'); g.setAttribute('tabindex', '0'); g.setAttribute('role', 'button');
    g.setAttribute('aria-label', p.label);
    g.style.animationDelay = reduce ? '0s' : (1 + n * 0.06).toFixed(2) + 's';
    var anchor = p.x > W * 0.78 ? 'end' : (p.x < W * 0.12 ? 'start' : 'middle');
    g.innerHTML = '<ellipse class="base" cx="' + p.x + '" cy="' + p.y + '" rx="4" ry="2.2"></ellipse>' +
      '<line class="stem" x1="' + p.x + '" y1="' + p.y + '" x2="' + p.x + '" y2="' + (p.y - STEM) + '"></line>' +
      '<circle class="head" cx="' + p.x + '" cy="' + (p.y - STEM) + '" r="5.5" style="transform-origin:' + p.x + 'px ' + (p.y - STEM) + 'px"></circle>' +
      '<text x="' + p.x + '" y="' + (p.y - STEM - 12) + '" text-anchor="' + anchor + '">' + p.label + '</text>';
    p.el = g;
    svg.appendChild(g);
  });
  var box = document.getElementById('map');
  box.appendChild(svg);
  function centreOn(x) { if (box.scrollWidth > box.clientWidth) { box.scrollTo({ left: x / W * box.scrollWidth - box.clientWidth / 2, behavior: reduce ? 'auto' : 'smooth' }); } }
  requestAnimationFrame(function () { var f = fromLonLat(60, 35); if (box.scrollWidth > box.clientWidth) { box.scrollLeft = (+sx(f[0])) / W * box.scrollWidth - box.clientWidth / 2; } });

  /* the list: tap a name to light its pin (handy on a phone, where there is no hover) */
  var list = document.getElementById('list'), current = null;
  function select(p, btn) {
    pins.forEach(function (q) { q.el.classList.toggle('on', q === p && current !== p); });
    Array.prototype.forEach.call(list.querySelectorAll('button'), function (b) { b.setAttribute('aria-pressed', String(b === btn && current !== p)); });
    current = current === p ? null : p;
    if (current) { pins.forEach(function (q) { q.el.style.animation = 'none'; }); svg.appendChild(p.el); centreOn(p.x); }  // keep the lit pin on top of its neighbours, and in view on a phone
  }
  PINS.forEach(function (row, k) {
    var p = pins.filter(function (q) { return q.k === k; })[0];
    var li = document.createElement('li'), b = document.createElement('button');
    b.type = 'button'; b.textContent = row[0]; b.setAttribute('aria-pressed', 'false');
    if (/Europe/.test(row[0])) { b.className = 'region'; }
    b.addEventListener('click', function () { select(p, b); });
    p.btn = b;
    li.appendChild(b); list.appendChild(li);
  });
  pins.forEach(function (p) {
    p.el.addEventListener('click', function () { select(p, p.btn); });
    p.el.addEventListener('keydown', function (e) { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); select(p, p.btn); } });
  });
})();
</script>
</body>
</html>
